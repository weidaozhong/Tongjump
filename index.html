<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>毛球向上跳</title>
<style>
  :root{
    --paper:#fff7ed; --ink:#3a3027; --sub:#8a7c66; --accent:#ff9a6c; --accentDark:#e07a48; --btn:#ff9a6c; --btnDark:#e07a48;
    --card:#ffffff; --cardBorder:#efe2cc; --ctrlBg:rgba(255,255,255,.8); --ctrlBd:#e7dccb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  @font-face{font-family:'sutra';src:url('assets/sutra.woff2') format('woff2');font-display:swap;}  /* 马善政楷书 OFL, 仅子集10字, 经文用 */
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;caret-color:transparent;   /* 禁文本选中+隐藏闪烁插入符：菜单/游戏里不再出现乱晃的光标 */
    font-family:"Comic Sans MS","Chalkboard SE","Segoe Print","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  body.boot #wrap{visibility:hidden;}
  #stage{position:relative;background:var(--paper);box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden;
    width:min(100vw,62.5vh);height:min(160vw,100vh);}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  body.nocursor, body.nocursor *{cursor:none !important;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:var(--ink);padding:3% 5%;gap:9px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .screen::-webkit-scrollbar{display:none;width:0;height:0;}
  #menu{justify-content:flex-start;overflow:hidden;padding-top:clamp(18px,4vh,46px);padding-bottom:clamp(14px,3.2vh,38px);}
  .m-inner{display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;margin-top:auto;margin-bottom:auto;transform-origin:top center;}
  .m-head{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .m-music{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
  .m-foot{display:flex;flex-direction:column;align-items:center;gap:15px;}
  .hidden{display:none!important;}
  .logo{font-size:clamp(22px,5.6vw,33px);font-weight:800;letter-spacing:1px;line-height:1.1;
    text-shadow:0 2px 6px rgba(0,0,0,.45);}
  .logo small{display:block;font-size:.42em;color:var(--sub);font-weight:700;letter-spacing:3px;margin-top:6px;}
  .sub{color:var(--sub);font-size:clamp(12px,3.2vw,14px);margin:-2px 0 0;text-shadow:0 1px 3px rgba(0,0,0,.30);}
  .swatches{display:flex;flex-direction:column;gap:7px;align-items:center;}
  .sw-row{display:flex;gap:7px;justify-content:center;}
  .sw{width:50px;height:56px;border-radius:14px;background:var(--card);border:3px solid var(--cardBorder);
    display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative;
    transition:transform .12s, border-color .12s, box-shadow .12s;padding-bottom:3px;}
  .sw img{width:80%;height:80%;object-fit:contain;}
  .sw.active{border-color:var(--accent);transform:translateY(-4px) scale(1.06);
    box-shadow:0 8px 18px rgba(0,0,0,.3);}
  .sw .nm{position:absolute;top:-9px;font-size:10px;background:var(--accent);color:#fff;
    padding:1px 7px;border-radius:8px;opacity:0;transition:.12s;}
  .sw.active .nm{opacity:1;}

  /* theme (music) selector */
  .seclbl{font-size:12px;color:var(--sub);letter-spacing:1px;display:flex;align-items:center;gap:8px;text-shadow:0 1px 3px rgba(0,0,0,.30);}
  .themes-pager{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;}
  .themes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 5px;flex:1 1 auto;max-width:300px;justify-items:center;padding:4px 0 6px;}
  .tparrow{flex:0 0 auto;width:22px;height:52px;padding:0;border:1px solid var(--ctrlBd);border-radius:9px;background:var(--ctrlBg);
    color:var(--ink);font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s;}
  .tparrow:active{transform:scale(.92);}
  .tparrow:disabled{opacity:.28;cursor:default;}
  .tparrow.thidden{visibility:hidden;}
  .tcard{width:100%;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.7;transition:.14s;}
  .tcard img{width:clamp(48px,13.5vw,60px);height:clamp(48px,13.5vw,60px);border-radius:13px;object-fit:cover;border:3px solid transparent;
    box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .tcard .tnm{font-size:10px;color:var(--sub);width:100%;line-height:1.2;
    white-space:normal;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.30);}
  .tcard.active{opacity:1;transform:translateY(-3px);}
  .tcard.active img{border-color:var(--accent);}
  .tcard.active .tnm{color:var(--ink);font-weight:700;}
  .tcv{position:relative;display:inline-block;line-height:0;}
  .tcard.locked img{filter:grayscale(.55) brightness(.78);}
  .tcard .tlock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;
    border-radius:13px;line-height:1;font-size:clamp(10px,2.65vw,12.5px);
    background:radial-gradient(115% 75% at 50% 16%,rgba(255,244,222,.13),transparent 58%),linear-gradient(180deg,rgba(46,32,18,.30),rgba(26,17,7,.56));}
  .tcard .tlock .lkico{width:2.4em;height:2.4em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
  .tcard .tlock .lkshW{fill:none;stroke:#fff7ec;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
  .tcard .tlock .lkbdW{fill:#fff7ec;stroke:#fff7ec;stroke-width:3;stroke-linejoin:round;}
  .tcard .tlock .lkshO,.tcard .tlock .lksh{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .tcard .tlock .lkshO{stroke:#5a3d1c;stroke-width:3.6;}
  .tcard .tlock .lksh{stroke:#fbe7c0;stroke-width:1.9;}
  .tcard .tlock .lkbd{fill:#fbe7c0;stroke:#5a3d1c;stroke-width:1.7;}
  .tcard .tlock .lkkh{fill:#c79436;}
  .tcard .tlock .lkreq{font-style:normal;font-weight:800;line-height:1;white-space:nowrap;font-size:.78em;letter-spacing:.02em;color:#5a3d1c;
    background:#fbe7c0;padding:.26em .6em;border-radius:.85em;transform:rotate(-2.5deg);
    box-shadow:0 0 0 1.3px #fbe7c0,0 0 0 2.7px rgba(90,61,28,.92),0 0 0 3.4px #fff7ec,0 2px 4px rgba(0,0,0,.34);}
  .tcard .tlock .lkreq em{font-style:normal;font-weight:900;color:#bb5f17;font-size:1.16em;margin:0 .05em;}
  @keyframes lkjiggle{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg)}45%{transform:rotate(6deg)}68%{transform:rotate(-4deg)}85%{transform:rotate(2deg)}}
  @media (hover:hover){.tcard.locked:hover .lkico{animation:lkjiggle .55s ease}.tcard.locked:hover .lkreq{transform:rotate(-2.5deg) scale(1.06)}}
  #shop{justify-content:flex-start;overflow:hidden;padding-top:clamp(16px,3.6vh,40px);padding-bottom:clamp(14px,3vh,34px);}
  .shop-inner{--arrcol:28px;width:100%;max-width:454px;margin:auto 0;display:flex;flex-direction:column;gap:13px;transform-origin:top center;}
  .shop-head{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-bottom:1px;}
  .shop-coins{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800;color:var(--ink);background:var(--card);border:1px solid var(--cardBorder);border-radius:999px;padding:5px 12px 5px 9px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .shop-title{margin:0;text-align:center;font-size:clamp(19px,5.2vw,24px);font-weight:800;letter-spacing:2px;color:var(--ink);line-height:1.12;text-shadow:0 2px 6px rgba(0,0,0,.4);}
  .shop-title small{display:block;font-size:.4em;color:var(--sub);font-weight:700;letter-spacing:3px;margin-top:8px;}
  #shopBack{padding:7px 15px;font-size:14px;border-radius:999px;box-shadow:0 4px 0 var(--cardBorder),0 5px 10px rgba(0,0,0,.16);}
  .shop-head-r{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;}
  #shopBack:active{transform:scale(.96);box-shadow:0 2px 0 var(--cardBorder);}
  .shop-tip{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.5;margin:-3px 0 3px;padding:0 8px;}
  #shopList{display:flex;flex-direction:column;gap:11px;width:100%;}
  .shop-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:16px;text-align:left;
    background:var(--card);border:1px solid var(--cardBorder);box-shadow:0 4px 13px rgba(0,0,0,.10);transition:transform .12s,box-shadow .12s;}
  .shop-row.owned{box-shadow:0 4px 13px rgba(0,0,0,.10),inset 4px 0 0 var(--accent);}
  .shop-row.focus{outline:2px solid var(--accent);outline-offset:2px;}
  .shop-row.sel{cursor:pointer;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(0,0,0,.16),inset 4px 0 0 var(--accent);transform:translateY(-1px);}
  .shop-row.owned{cursor:pointer;}
  .shop-cv{width:54px;height:54px;flex:0 0 auto;border-radius:12px;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.26);}
  .shop-info{flex:1;min-width:0;}
  .shop-row.consum{width:fit-content;max-width:100%;}   /* 消耗品: 卡片宽度收到内容, 不与主题卡同宽 */
  .shop-row.consum .shop-info{flex:0 1 auto;}   /* 文案自然宽, 兑换按钮紧跟其后, 去掉中间大空白 */
  .shop-pager{display:flex;align-items:center;gap:6px;width:100%;}
  .shop-pager>#shopList{flex:1 1 auto;width:auto;min-width:0;}
  #shopConsumables{display:flex;flex-direction:column;align-items:flex-end;gap:16px;margin-bottom:16px;padding-right:var(--arrcol);}   /* 消耗品: 右对齐(内缩与主题卡同宽) + 卡片间距拉开 */
  #shopConsumables.noarr{padding-right:0;}
  .shop-nm{font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .shop-st{font-size:11.5px;color:var(--sub);margin-top:3px;}
  .shop-row.owned .shop-st{color:var(--accent);font-weight:700;}
  .shop-buy{flex:0 0 auto;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;border:none;border-radius:999px;padding:9px 17px;
    color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(0,0,0,.12)),var(--btn);box-shadow:0 3px 0 var(--btnDark),0 5px 11px rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s;}
  .shop-buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btnDark);}
  .shop-buy[disabled]{opacity:.42;cursor:default;box-shadow:0 3px 0 var(--btnDark);}
  .shop-row.owned .shop-buy{background:var(--card);color:var(--btn);box-shadow:0 3px 0 var(--cardBorder);}
  .shop-foot{font-size:11px;color:var(--sub);text-align:center;letter-spacing:2px;opacity:.72;margin-top:6px;}
  @media (hover:hover){.shop-row:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.14);}}

  .btn{font-family:inherit;font-weight:800;border:none;cursor:pointer;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.14) 100%),var(--btn);
    padding:13px 32px;border-radius:30px;font-size:clamp(16px,4.4vw,19px);
    box-shadow:0 6px 0 var(--btnDark),0 10px 18px rgba(0,0,0,.3),inset 0 1.5px 0 rgba(255,255,255,.40),inset 0 -2px 2px rgba(0,0,0,.12);transition:transform .08s, box-shadow .08s;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btnDark),0 4px 10px rgba(0,0,0,.3);}
  .btn.ghost{background:var(--card);color:var(--btn);box-shadow:0 6px 0 var(--cardBorder),0 10px 18px rgba(0,0,0,.2);}
  .btn.ghost:active{box-shadow:0 2px 0 var(--cardBorder);}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .big{font-size:clamp(40px,13vw,72px);font-weight:800;color:var(--accent);line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.4);}
  .lbl{font-size:13px;color:var(--sub);letter-spacing:2px;text-transform:uppercase;}
  .best{font-size:15px;color:var(--sub);}
  .m-url{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
    letter-spacing:.4px;background:rgba(128,128,128,.10);padding:5px 13px;border-radius:20px;
    margin-top:2px;user-select:all;}
  .m-url svg{width:13px;height:13px;opacity:.85;}
  .urlbox,.m-url{-webkit-user-select:all;user-select:all;}   /* 复制链接处保留可选中（插入符仍隐藏，靠高亮选区复制即可） */

  /* 结束/暂停弹窗：遮罩+卡片，避免与游戏画面互相遮挡 */
  .screen.modal{background:rgba(12,10,9,0.55);}
  .panel{background:var(--card);border:1px solid var(--cardBorder);border-radius:24px;
    padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:11px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:88%;}

  /* 分享 */
  .qr{width:172px;height:172px;border-radius:12px;background:#fff;padding:7px;object-fit:contain;}
  .urlbox{width:100%;max-width:280px;font-family:inherit;font-size:12px;padding:8px 10px;border:1px solid var(--cardBorder);
    border-radius:10px;background:rgba(128,128,128,.12);color:var(--ink);text-align:center;}
  .share-apps{display:flex;gap:12px;justify-content:center;margin:4px 0 2px;}
  .shareapp{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11.5px;color:var(--ink);padding:2px;}
  .shareapp .ic{position:relative;overflow:hidden;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2);transition:transform .1s;}
  .shareapp .ic svg{width:24px;height:24px;display:block;}
  .shareapp .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .shareapp:active .ic{transform:scale(.92);}
  .btn.wechat{background:#07c160;box-shadow:0 6px 0 #059a4c,0 10px 18px rgba(7,193,96,.35);}
  .btn.wechat:active{box-shadow:0 2px 0 #059a4c;}
  .toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;white-space:nowrap;}
  .toast.show{opacity:1;}
  #playhint{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);max-width:86%;background:rgba(0,0,0,.6);color:#fff;
    font-size:13px;line-height:1.5;text-align:center;padding:9px 16px;border-radius:16px;pointer-events:none;z-index:45;opacity:0;transition:opacity .45s;}
  #playhint.show{opacity:1;}

  /* HUD */
  #hud{position:absolute;top:-5px;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:14px 16px;pointer-events:none;}
  #score{font-size:clamp(22px,6vw,30px);font-weight:800;color:var(--score,#3a3027);text-shadow:0 1px 4px rgba(0,0,0,.5);line-height:1.05;}
  #runCoinHud{position:absolute;top:53px;left:16px;display:flex;align-items:center;gap:3px;font-size:14px;font-weight:800;color:var(--ink,#3a3027);background:var(--card,#fff);border:1px solid var(--cardBorder,#e7dccb);border-radius:999px;padding:3px 9px;box-shadow:0 2px 6px rgba(0,0,0,.14);pointer-events:none;white-space:nowrap;}
  .m-top{position:absolute;top:10px;right:14px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  #coinHud{z-index:4;font-weight:800;font-size:15px;color:var(--ink,#3a3027);background:var(--card,#fff);border:1px solid var(--cardBorder,#e7dccb);border-radius:999px;padding:3px 11px;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none;}
  .hudbtns{display:flex;align-items:center;gap:8px;pointer-events:auto;}
  .coinico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:0 0 auto;}
  #hp{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));}
  #hp .heart{width:22px;height:22px;transition:transform .15s ease;}
  #hp .heart svg{width:100%;height:100%;display:block;}
  #hp .heart.lost{transform:scale(.8);opacity:.85;}
  .ctrl-btn{width:38px;height:38px;border-radius:50%;background:var(--ctrlBg);border:2px solid var(--ctrlBd);
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);}
  .ctrl-btn svg{width:20px;height:20px;}
  /* how-to-play panel (theme-aware, sits between music picker and start) */
  .howto{display:flex;flex-direction:column;gap:7px;width:100%;max-width:340px;
    background:var(--ctrlBg);border:1.5px solid var(--ctrlBd);border-radius:16px;padding:11px 14px;}
  .howto .ht{display:flex;align-items:flex-start;gap:9px;text-align:left;}
  .howto .tag{flex:0 0 auto;width:50px;text-align:center;font-size:10.5px;font-weight:800;line-height:1.5;
    color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.14) 100%),var(--btn);border-radius:9px;padding:2px 4px;box-shadow:0 2px 4px rgba(0,0,0,.16);}
  .howto .tx{flex:1;min-width:0;font-size:11.5px;line-height:1.55;color:var(--sub);}
  .howto .tx b{color:var(--ink);font-weight:700;}

  /* ===== 结算卡 · 手绘高度勋章（重设计） ===== */
  @keyframes resPop{0%{transform:scale(.84) translateY(10px);opacity:0}60%{transform:scale(1.03) translateY(0);opacity:1}100%{transform:scale(1)}}
  @keyframes charBob{0%,100%{transform:translateX(-50%) rotate(-6deg) translateY(0)}50%{transform:translateX(-50%) rotate(-6deg) translateY(-6px)}}
  @keyframes badgePop{0%{transform:rotate(11deg) scale(0)}70%{transform:rotate(11deg) scale(1.18)}100%{transform:rotate(11deg) scale(1)}}
  @keyframes squiggleDraw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .result{position:relative;background:var(--card);border-radius:30px;padding:34px 26px 20px;width:332px;max-width:90%;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    box-shadow:0 3px 0 var(--cardBorder),0 0 0 2.5px var(--cardBorder),0 26px 54px rgba(0,0,0,.5);
    background-image:radial-gradient(rgba(128,128,128,.10) 1px,transparent 1.5px);background-size:15px 15px;
    animation:resPop .5s cubic-bezier(.2,1.3,.4,1) both;overflow:visible;}
  .result>:not(.result-tape):not(.result-char):not(.record-badge){animation:riseIn .42s ease both;}
  .result-label{animation-delay:.10s}.score-wrap{animation-delay:.16s}
  .best-flag{animation-delay:.22s}.result-actions{animation-delay:.28s}.result-hint{animation-delay:.34s}
  .result-tape{position:absolute;top:-8px;left:50%;width:104px;height:21px;transform:translateX(-50%) rotate(-3deg);
    background:var(--accent);opacity:.5;border-radius:3px;mix-blend-mode:multiply;}
  .result-char{position:absolute;top:-48px;left:50%;width:76px;height:76px;
    transform:translateX(-50%) rotate(-6deg);filter:drop-shadow(0 7px 6px rgba(0,0,0,.32));
    animation:charBob 2.6s ease-in-out infinite;pointer-events:none;}
  .record-badge{position:absolute;top:2px;right:-8px;background:var(--accent);color:#fff;font-weight:800;
    font-size:12px;letter-spacing:1px;padding:6px 12px;border-radius:14px 14px 14px 3px;transform:rotate(11deg);
    box-shadow:0 4px 0 rgba(0,0,0,.16);animation:badgePop .55s .4s cubic-bezier(.2,1.6,.4,1) both;z-index:2;}
  .record-badge.hidden{display:none}
  .result-label{margin-top:16px;font-size:12px;letter-spacing:3px;color:var(--sub);font-weight:700;}
  .score-wrap{position:relative;display:flex;align-items:baseline;gap:3px;line-height:.86;margin:2px 0 4px;}
  .score-num{font-size:clamp(56px,19vw,82px);font-weight:800;color:var(--accent);letter-spacing:-2px;
    text-shadow:0 3px 0 rgba(0,0,0,.10);}
  .score-unit{font-size:23px;font-weight:800;color:var(--accent);opacity:.65;}
  .score-squiggle{position:absolute;left:-5px;bottom:-7px;width:calc(100% + 10px);height:10px;}
  .score-squiggle path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:240;animation:squiggleDraw .65s .32s ease both;opacity:.8;}
  .best-flag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub);
    background:rgba(128,128,128,.13);padding:5px 14px;border-radius:20px;}
  .best-flag svg{width:14px;height:14px;}
  .result-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px;}
  .rbtn{font-family:inherit;font-weight:800;border:none;cursor:pointer;border-radius:22px;padding:13px 18px;
    font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s;}
  .rbtn svg{width:19px;height:19px;}
  .rbtn-primary{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.14) 100%),var(--btn);box-shadow:0 5px 0 var(--btnDark);}
  .rbtn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnDark);}
  .rbtn-share{color:#fff;background:#07c160;box-shadow:0 5px 0 #059a4c;}
  .rbtn-share:active{transform:translateY(4px);box-shadow:0 1px 0 #059a4c;}
  .rbtn-ghost{background:transparent;color:var(--sub);box-shadow:none;font-size:14px;padding:5px;}
  .rbtn-ghost:active{transform:translateY(1px);}
  .result-hint{font-size:11.5px;color:var(--sub);opacity:.82;margin-top:2px;}

  /* ===== 桌面 / 横屏重排 =====
     竖屏舞台(5:8)在宽屏下会变成"满高、窄宽"的居中高条：四周原本是死黑，
     而菜单还是手机尺寸，于是内容缩在正中、四周大片留白(就是"挤在中间"的来源)。
     对策：①四周做暖色氛围底 ②舞台加圆角外框像一台设备 ③菜单随画面高度等比放大铺满。
     仅当 min-aspect-ratio:5/8(比手机竖屏更宽)时生效，竖屏手机完全不受影响。 */
  @media (min-aspect-ratio: 5/8){
    html,body{
      background:
        radial-gradient(58% 48% at 50% 30%, rgba(255,186,132,.13), rgba(255,186,132,0) 70%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 46px),
        radial-gradient(135% 115% at 50% -5%, #3c352c 0%, #251f1a 52%, #15110e 100%);
    }
    #stage{border-radius:30px;
      box-shadow:0 40px 90px -22px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.07);}
    #menu{padding:clamp(26px,5vh,64px) 8%;}
    .m-inner{gap:clamp(16px,2.5vh,32px);}
    .m-head{gap:clamp(6px,1vh,12px);}
    .m-music{gap:clamp(8px,1.4vh,16px);}
    .m-foot{gap:clamp(15px,2.4vh,26px);}
    .logo{font-size:clamp(30px,4.8vh,46px);}
    .logo small{font-size:.4em;letter-spacing:5px;margin-top:9px;}
    .sub{font-size:clamp(13px,1.9vh,17px);}
    .swatches{gap:clamp(9px,1.5vh,16px);}
    .sw-row{gap:clamp(9px,1.5vh,16px);}
    .sw{width:clamp(56px,7.6vh,76px);height:clamp(62px,8.6vh,84px);border-radius:18px;}
    .sw .nm{font-size:clamp(10px,1.3vh,12px);top:-11px;}
    .seclbl{font-size:clamp(12px,1.8vh,15px);}
    .themes-grid{gap:clamp(12px,1.7vh,20px) clamp(8px,1.2vh,16px);max-width:clamp(330px,52vh,560px);padding-bottom:8px;}
    .tparrow{width:clamp(26px,3.2vh,40px);height:clamp(58px,9vh,104px);font-size:clamp(22px,2.8vh,30px);border-radius:12px;}
    .shop-inner{--arrcol:calc(clamp(26px,3.2vh,40px) + 6px);}
    .tcard{width:clamp(72px,9.4vh,98px);}
    .tcard img{width:clamp(64px,8.4vh,88px);height:clamp(64px,8.4vh,88px);border-radius:17px;}
    .tcard .tnm{font-size:clamp(10px,1.4vh,12px);width:clamp(70px,9.4vh,100px);}
    .tcard .tlock{font-size:clamp(11.5px,1.55vh,14.5px);}
    .howto{max-width:clamp(340px,42vh,440px);gap:clamp(9px,1.4vh,14px);
      padding:clamp(13px,1.9vh,20px) clamp(16px,2.2vh,26px);border-radius:18px;}
    .howto .tag{width:clamp(50px,6vh,62px);font-size:clamp(11px,1.5vh,13px);}
    .howto .tx{font-size:clamp(12px,1.7vh,15px);line-height:1.6;}
    .btn{font-size:clamp(18px,2.5vh,23px);padding:clamp(14px,1.9vh,19px) clamp(34px,5.2vh,50px);}
    .m-url{font-size:clamp(12px,1.6vh,14px);padding:6px 15px;}
  }
</style>
</head>
